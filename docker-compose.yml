services:
  mongodb:
    image: mongo:7
    container_name: micro-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  sonarqube:
    image: sonarqube:community
    container_name: micro-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  mongo_data:
  sonar_data:
  sonar_extensions:
  sonar_logs: